name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run local-equivalent quality gate
        run: npm run ci:verify

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build non-root runtime image
        run: docker build --target runtime --tag quit-count-api:ci .
      - name: Verify runtime security, health, and graceful shutdown
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force quit-count-api-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker image inspect --format '{{.Config.User}}' quit-count-api:ci)" = "node"
          docker run --detach \
            --name quit-count-api-ci \
            --init \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 3000:3000 \
            quit-count-api:ci

          ready=false
          for attempt in $(seq 1 30); do
            if test "$(curl --silent --show-error --fail http://127.0.0.1:3000/)" = "Hello World!"; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = "true"

          docker kill --signal SIGTERM quit-count-api-ci >/dev/null
          stopped=false
          for attempt in $(seq 1 10); do
            if test "$(docker inspect --format '{{.State.Running}}' quit-count-api-ci)" = "false"; then
              stopped=true
              break
            fi
            sleep 1
          done
          test "$stopped" = "true"
          test "$(docker inspect --format '{{.State.ExitCode}}' quit-count-api-ci)" = "0"
