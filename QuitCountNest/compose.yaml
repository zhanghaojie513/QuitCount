services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quitcount}
      POSTGRES_USER: ${POSTGRES_USER:-quitcount}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      target: runtime
      args:
        NODE_VERSION: 24.16.0
    image: quit-count-api:local
    user: node
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-quitcount}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quitcount}?schema=public
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-3000}
      RELEASE_SHA: ${RELEASE_SHA:-local}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  migrate:
    build:
      context: .
      target: dependencies
      args:
        NODE_VERSION: 24.16.0
    profiles: [tools]
    working_dir: /app
    command: npm run db:migrate:deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quitcount}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quitcount}?schema=public
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
